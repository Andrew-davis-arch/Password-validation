<!DOCTYPE html>
<html>
<head>
  <title>Username Password Validation</title>
</head>
<body>

<h3>Login Validation</h3>

<label>Username:</label><br>
<input type="text" id="username" placeholder="e.g. John_student"><br><br>

<label>Password:</label><br>
<input type="password" id="password" placeholder="e.g. Pass@1234"><br><br>

<button onclick="validate()">Check</button>

<p id="result"></p>

<script>
  function validate() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;
    let result = document.getElementById("result");

    // Username validation
    let startsWithCapital = /^[A-Z]/.test(username);
    let containsStudent = username.toLowerCase().includes("student");
    let isUsernameValid = startsWithCapital && containsStudent;

    // Password validation
    let isLongEnough = password.length >= 8;
    let hasUpper = /[A-Z]/.test(password);
    let hasLower = /[a-z]/.test(password);
    let hasDigit = /[0-9]/.test(password);
    let hasSpecial = /[^A-Za-z0-9]/.test(password);
    let isPasswordValid = isLongEnough && hasUpper && hasLower && hasDigit && hasSpecial;

    // Final result
    if (isUsernameValid && isPasswordValid) {
      result.innerHTML = "Username and Password are VALID";
      result.style.color = "green";
    } else {
      let message = "INVALID:<br>";
      if (!isUsernameValid) {
        message += "- Username must start with a Capital letter and contain 'student'<br>";
      }
      if (!isPasswordValid) {
        message += "- Password must be 8+ chars with upper, lower, digit, special char<br>";
      }
      result.innerHTML = message;
      result.style.color = "red";
    }
  }
</script>

</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Validation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      padding: 35px 30px;
      border-radius: 16px;
      width: 380px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    .card h2 {
      text-align: center;
      margin-bottom: 5px;
      color: #333;
    }
    .card p.subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 25px;
    }
    label {
      font-size: 14px;
      font-weight: 600;
      color: #444;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      margin-top: 6px;
      margin-bottom: 18px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      transition: 0.2s;
    }
    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
    }
    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #5a6fd5;
      transform: translateY(-1px);
    }
    #result {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }
    .valid {
      display: block !important;
      background: #e6f9ed;
      color: #1a7a3a;
      border: 1px solid #a3e6b8;
    }
    .invalid {
      display: block !important;
      background: #ffe6e6;
      color: #b42318;
      border: 1px solid #ffb3b3;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: -12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Welcome Back</h2>
  <p class="subtitle">Validate your student account</p>

  <label>Username</label>
  <input type="text" id="username" placeholder="e.g. John_student">
  <div class="hint">Must start with Capital & contain "student"</div>

  <label>Password</label>
  <input type="password" id="password" placeholder="e.g. Pass@1234">
  <div class="hint">8+ chars, upper, lower, number, special char</div>

  <button onclick="validate()">Validate Login</button>

  <div id="result"></div>
</div>

<script>
  function validate() {
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value;
    let result = document.getElementById("result");

    let startsWithCapital = /^[A-Z]/.test(username);
    let containsStudent = username.toLowerCase().includes("student");
    let isUsernameValid = startsWithCapital && containsStudent;

    let isLongEnough = password.length >= 8;
    let hasUpper = /[A-Z]/.test(password);
    let hasLower = /[a-z]/.test(password);
    let hasDigit = /[0-9]/.test(password);
    let hasSpecial = /[^A-Za-z0-9]/.test(password);
    let isPasswordValid = isLongEnough && hasUpper && hasLower && hasDigit && hasSpecial;

    if (isUsernameValid && isPasswordValid) {
      result.className = "valid";
      result.innerHTML = "✔ Username and Password are <b>VALID</b>";
    } else {
      result.className = "invalid";
      let msg = "<b>INVALID:</b><br>";
      if (!isUsernameValid) msg += "• Username must start with Capital letter and include 'student'<br>";
      if (!isPasswordValid) msg += "• Password must be 8+ chars with A-Z, a-z, 0-9 and @#$%<br>";
      result.innerHTML = msg;
    }
  }
</script>

</body>
</html>
